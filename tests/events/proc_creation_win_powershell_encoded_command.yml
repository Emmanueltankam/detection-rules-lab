# Synthetic events — no real host or user data.
match:
  - description: Hidden PowerShell with short -enc flag
    Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    OriginalFileName: 'PowerShell.EXE'
    CommandLine: 'powershell.exe -NoP -W Hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA'
    ParentImage: 'C:\Windows\System32\cmd.exe'
  - description: Renamed binary caught through OriginalFileName
    Image: 'C:\Users\Public\svc.exe'
    OriginalFileName: 'PowerShell.EXE'
    CommandLine: 'svc.exe -EncodedCommand SQBFAFgA'
  - description: PowerShell 7 with -ec
    Image: 'C:\Program Files\PowerShell\7\pwsh.exe'
    CommandLine: 'pwsh.exe -ec SQBFAFgA'
no_match:
  - description: Admin script run from file
    Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    OriginalFileName: 'PowerShell.EXE'
    CommandLine: 'powershell.exe -ExecutionPolicy Bypass -File C:\Scripts\backup.ps1'
  - description: Encoded flag on a non-PowerShell process
    Image: 'C:\Tools\encoder.exe'
    OriginalFileName: 'encoder.exe'
    CommandLine: 'encoder.exe -enc input.txt'
