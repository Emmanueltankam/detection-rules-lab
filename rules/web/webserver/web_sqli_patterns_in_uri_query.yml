title: SQL Injection Patterns In URI Query
id: 3c608022-fa09-45df-9b80-33527c136ae8
status: test
description: |
  Detects classic SQL injection payloads in the query string of web requests (UNION-based, boolean-based,
  time-based and schema enumeration), in clear text and in common URL-encoded forms.
  Particularly relevant for public-facing financial APIs.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/SQL_Injection
author: Emmanuel Tankam Talla
date: 2026-11-08
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
      - 'union select'
      - 'union all select'
      - 'union%20select'
      - 'union+select'
      - 'union%20all%20select'
      - "' or '1'='1"
      - "' or 1=1"
      - '%27%20or%201=1'
      - 'information_schema'
      - 'sleep('
      - 'benchmark('
      - 'waitfor delay'
      - 'waitfor%20delay'
      - '@@version'
  condition: selection
falsepositives:
  - Authorized vulnerability scans run by your own team
  - Search features where users legitimately type SQL keywords
level: high
